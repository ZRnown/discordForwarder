version: '3.8'

services:
  discord-forwarder:
    build: .
    container_name: discord-forwarder
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 挂载配置文件，方便修改
      - ./config.json:/app/config.json:ro
      # 挂载日志目录
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production

